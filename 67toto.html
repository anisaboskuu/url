    <style amp-custom>
      :root {
        --red: #1fd400;
        --dred: #154f1a;
        --text: rgba(66, 195, 0, 0.8);
        --fnt: "Rajdhani", sans-serif;
        --border-width: 2px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: var(--fnt);
        background: #000;
        color: #fff;
        min-height: 100vh;
        width: 100%;
        overflow: auto;
      }

      .hud-stage {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: url();
        background-repeat: no-repeat;
        background-size: cover;
      }

      .hud-stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(rgba(18, 10, 10, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
          linear-gradient(
            90deg,
            rgba(255, 0, 0, 0.02),
            rgba(255, 0, 0, 0.01),
            rgba(0, 0, 255, 0.02)
          );
        background-size:
          100% 3px,
          3px 100%;
        z-index: 2;
        pointer-events: none;
      }

      .system-interface {
        position: relative;
        z-index: 20;
        width: 90%;
        margin: 10px 0;
        max-width: 400px;
        padding: 20px;
        text-align: center;
        box-shadow: 0 0 30px rgb(0 255 55 / 30%);
        animation: system-boot 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        background: var(--red);
        clip-path: polygon(
          0 30px,
          30px 0,
          100% 0,
          100% calc(100% - 30px),
          calc(100% - 30px) 100%,
          0 100%
        );
      }
      @keyframes system-boot {
        from {
          opacity: 0;
          transform: scale(1.1);
          filter: brightness(3);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: brightness(1);
        }
      }

      .system-interface::before {
        content: "";
        position: absolute;
        top: var(--border-width);
        left: var(--border-width);
        right: var(--border-width);
        bottom: var(--border-width);
        z-index: -1;
        background: rgba(10, 0, 0);
        box-shadow: inset 0 0 15px rgb(4 255 0 / 15%);
        clip-path: polygon(
          0 30px,
          30px 0,
          100% 0,
          100% calc(100% - 30px),
          calc(100% - 30px) 100%,
          0 100%
        );
      }

      .logo-shell {
        margin-bottom: 10px;
        position: relative;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .data-frame {
        width: 100%;
        margin-bottom: 5px;
        line-height: 0;
        position: relative;
        padding: 4px;
      }

      .data-frame::before {
        content: "";
        position: absolute;
        top: -4px;
        right: -4px;
        width: 12px;
        height: 12px;
        border-top: 2px solid var(--red);
        border-right: 2px solid var(--red);
        animation: clickframe 1s linear infinite;
      }

      .data-frame::after {
        content: "";
        position: absolute;
        bottom: -4px;
        left: -4px;
        width: 12px;
        height: 12px;
        border-bottom: 2px solid var(--red);
        border-left: 2px solid var(--red);
        animation: clickframe 1s linear infinite;
      }

      @keyframes clickframe {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }

      .banner-container {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 3px;
        box-sizing: border-box;
        overflow: hidden;
        border-radius: 10px;
        flex-shrink: 0;
        background: rgb(0 232 52 / 25%);
        box-shadow:
          0 0 20px rgba(0, 0, 0, 0.85),
          0 0 16px rgba(216, 31, 38, 0.2);
        transition:
          box-shadow 0.3s ease,
          transform 0.3s ease;
      }

      .banner-container::before,
      .banner-container::after {
        content: "";
        position: absolute;
        width: 150%;
        height: 150%;
        background: conic-gradient(
          transparent,
          transparent,
          transparent,
          #f2b233
        );
        animation: rotateGlow 4s linear infinite;
      }

      .banner-container::after {
        background: conic-gradient(from 0deg, transparent 0%, transparent 30%, rgb(237 208 0 / 50%) 40%, #c8c800 50%, transparent 50%, transparent 80%, rgb(12 200 0 / 50%) 90%, #099000 100%);
        animation-delay: -2s;
      }

      @keyframes rotateGlow {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .banner-content {
        position: relative;
        z-index: 4;
        width: 100%;
        height: 100%;
        background: #111;
        border-radius: 8px;
        overflow: hidden;
      }

      .banner-container:hover {

      .btn-amp-content {

      .monitor-footer {

      .diag-row {

      .full-diag-pod::before {
        content: "";

        border: 1.5px solid var(--red);
        clip-path: polygon(

          1px calc(100% - 1px),

          calc(100% - 1px) 85%,
          100% 85%,
          100% 15%,
          calc(100% - 1px) 15%,
          calc(100% - 1px) 1px,
          85% 1px,
          85% 0,
          100% 0
        );
        animation: diag-pulse 2s infinite alternate;
      }
      @keyframes diag-pulse {
        from {

      .diag-meta {
